# 운영(EC2) 프로필. docker-compose.prod.yml에서 SPRING_PROFILES_ACTIVE=prod로 켠다.
# DB 접속 정보는 application.yml의 ${DB_*} 환경 변수로 들어온다.
spring:
  jpa:
    show-sql: false

server:
  # nginx가 알려 준 실제 접속 방식(X-Forwarded-Proto)을 따른다. 없으면 HTTPS에서도 소셜 로그인 콜백이 http로 만들어진다
  # backend는 외부에 열지 않으므로 nginx(사설망)가 보낸 헤더만 들어온다
  forward-headers-strategy: native

logging:
  level:
    root: INFO
    com.mealfit: INFO

# 외부에 API 문서를 노출하지 않는다 (nginx도 /api만 넘긴다). Swagger는 로컬에서 확인
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# [HttpOnly쿠키][보안] 운영(HTTPS)에서는 Refresh Token 쿠키에 Secure 플래그를 기본 강제합니다.
mealfit:
  auth:
    cookie-secure: ${AUTH_COOKIE_SECURE:true}
