spring:
  application:
    name: mealfit
  config:
    # 루트 .env를 읽는다 (backend/에서 실행하든 루트에서 실행하든). 없으면 무시.
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    # PostgreSQL. RDS는 DB_URL 전체를 준다 (TLS 검증, SDD 11장)
    # 예) DB_URL=jdbc:postgresql://<RDS 엔드포인트>:5432/mealfit?sslmode=verify-full&sslrootcert=/etc/mealfit/rds-global-bundle.pem
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:mealfit}}
    username: ${DB_USERNAME:mealfit}
    password: ${DB_PASSWORD:mealfit}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # 스키마는 Flyway만 변경한다 (db/migration/postgresql)
    properties:
      hibernate:
        default_batch_fetch_size: 100
        jdbc.time_zone: Asia/Seoul
  flyway:
    enabled: true
    # PostgreSQL 전용 경로. db/migration/ 바로 아래 V1–V7은 MariaDB 이력 보관용으로 더 이상 실행하지 않는다
    # db/vendor/{vendor}: 실제 PostgreSQL에서만 도는 마이그레이션(pgvector 등). 테스트용 H2에서는 db/vendor/h2(없음)로 바뀌어 건너뛴다
    locations: classpath:db/migration/postgresql,classpath:db/vendor/{vendor}
  jackson:
    time-zone: Asia/Seoul
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}

mealfit:
  ai:
    # Python AI 서비스(FastAPI + Gemini). Gemini 키는 Python 쪽에만 둔다.
    base-url: ${AI_SERVICE_URL:http://localhost:8000}
    connect-timeout: 3s
    read-timeout: 20s

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  default-produces-media-type: application/json

management:
  endpoints:
    web:
      exposure:
        include: health,info

jwt:
  # Base64로 인코딩한 서명 키입니다. 실제 값은 .env에서 읽습니다.
  secret: ${JWT_SECRET}

  # Access Token 유효기간: 30분
  access-token-ttl: 30m

  # Refresh Token 유효기간: 14일
  refresh-token-ttl: 14d
