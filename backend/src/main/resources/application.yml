spring:
  application:
    name: mealfit
  config:
    # 루트 .env를 읽는다 (backend/에서 실행하든 루트에서 실행하든). 없으면 무시.
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  servlet:
    multipart:
      # Flask와 동일한 파일 한도이며 요청에는 multipart 여유 크기를 포함함.
      max-file-size: 10MB
      max-request-size: 11MB
  datasource:
    # PostgreSQL. RDS는 DB_URL 전체를 준다 (TLS 검증, SDD 11장)
    # 예) DB_URL=jdbc:postgresql://<RDS 엔드포인트>:5432/mealfit?sslmode=verify-full&sslrootcert=/etc/mealfit/rds-global-bundle.pem
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:mealfit}}
    username: ${DB_USERNAME:mealfit}
    password: ${DB_PASSWORD:mealfit}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # 스키마는 Flyway만 변경한다 (db/migration/postgresql)
    properties:
      hibernate:
        default_batch_fetch_size: 100
        jdbc.time_zone: Asia/Seoul
  flyway:
    enabled: true
    # PostgreSQL 전용 경로. db/migration/ 바로 아래 V1–V7은 MariaDB 이력 보관용으로 더 이상 실행하지 않는다
    # db/vendor/{vendor}: 실제 PostgreSQL에서만 도는 마이그레이션(pgvector 등). 테스트용 H2에서는 db/vendor/h2(없음)로 바뀌어 건너뛴다
    locations: classpath:db/migration/postgresql,classpath:db/vendor/{vendor}
  jackson:
    time-zone: Asia/Seoul
    default-property-inclusion: non_null
  # [소셜로그인] Google·Naver·Kakao OAuth2 클라이언트 설정 (실제 키는 .env에만 보관)
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:disabled}
            client-secret: ${GOOGLE_CLIENT_SECRET:disabled}
            scope:
              - email
              - profile
          naver:
            client-id: ${NAVER_CLIENT_ID:disabled}
            client-secret: ${NAVER_CLIENT_SECRET:disabled}
            client-name: Naver
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - nickname
              - email
          kakao:
            client-id: ${KAKAO_CLIENT_ID:disabled}
            client-secret: ${KAKAO_CLIENT_SECRET:disabled}
            client-name: Kakao
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - profile_nickname
              - account_email
        provider:
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
  # [이메일인증][SMTP] 실제 메일 발송 설정 (MAIL_PROVIDER=smtp일 때 사용, 비밀값은 .env에만 보관)
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

server:
  port: ${SERVER_PORT:8080}

mealfit:
  auth:
    # [HttpOnly쿠키][보안] 운영(prod)에서는 Secure=true, 로컬 HTTP 개발에서는 false
    cookie-secure: ${AUTH_COOKIE_SECURE:false}
    # [보안] /refresh, /logout 동일 출처(Origin/Referer) 검증 허용 목록
    allowed-origins: ${AUTH_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080}
    # [이메일인증] log(로컬 콘솔 출력) | smtp(실제 메일 발송)
    mail-provider: ${MAIL_PROVIDER:log}
    mail-from: ${MAIL_FROM:${MAIL_USERNAME:}}
    mail-from-name: ${MAIL_FROM_NAME:MealFit}
    frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
  ai:
    # Python AI 서비스(FastAPI + Gemini). Gemini 키는 Python 쪽에만 둔다.
    base-url: ${AI_SERVICE_URL:http://localhost:8000}
    connect-timeout: 3s
    read-timeout: 20s

logging:
  pattern:
    # 요청 식별자(X-Request-Id)를 모든 로그 줄에 표시한다
    correlation: "[%X{requestId:-}] "

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  default-produces-media-type: application/json

management:
  endpoints:
    web:
      exposure:
        include: health,info

jwt:
  # Base64로 인코딩한 서명 키입니다. 실제 값은 .env에서 읽습니다.
  secret: ${JWT_SECRET}

  # Access Token 유효기간: 30분
  access-token-ttl: 30m

  # Refresh Token 유효기간: 14일
  refresh-token-ttl: 14d
