plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.mealfit'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        // 로컬에 21이 없으면 Gradle이 자동으로 내려받는다 (settings.gradle의 foojay 플러그인)
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

ext {
    springdocVersion = '2.8.17'
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // DB
    // 운영: Amazon RDS for PostgreSQL, 로컬: pgvector/pgvector 컨테이너 (SDD 8장)
    runtimeOnly 'org.postgresql:postgresql'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql' // PostgreSQL 지원 모듈

    // API 문서 (Swagger UI: /swagger-ui.html)
    implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springdocVersion}"

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'com.h2database:h2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // 인증·인가와 BCrypt 비밀번호 해시에 사용합니다.
    // Spring Security 버전은 Spring Boot가 관리합니다.
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // [소셜로그인] Google·Naver·Kakao OAuth2 로그인 연동에 사용합니다.
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'

    // [이메일인증][SMTP] 실제 인증 메일 발송에 사용합니다.
    implementation 'org.springframework.boot:spring-boot-starter-mail'

    // JWT 생성·검증에 사용하는 공개 API입니다.
    implementation 'io.jsonwebtoken:jjwt-api:0.13.0'

    // JWT 내부 구현과 JSON 처리는 실행 시 사용합니다.
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.13.0'

    // 인증·권한 관련 테스트에 사용합니다.
    testImplementation 'org.springframework.security:spring-security-test'
}

tasks.named('test') {
    useJUnitPlatform()
}
