# 운영(EC2) 배포용. 로컬 개발은 docker-compose.yml(DB만)을 쓴다.
# 실행: cp .env.prod.example .env (값 채우기) → docker compose -f docker-compose.prod.yml up -d --build --remove-orphans
# 외부에 열리는 포트는 80·443(frontend)뿐이다. backend(8080)·ai-service(8000)는 내부 네트워크에서만 통신한다.
# DB는 Amazon RDS for PostgreSQL 16(+pgvector)이다. 이 파일에는 DB 컨테이너가 없다 (2026-11 RDS 전환, 데이터 이관 없이 새로 시작)
# CI 통합 검사는 RDS 대신 docker-compose.ci.yml로 PostgreSQL 컨테이너를 붙여 같은 구성을 띄운다
services:
  backend:
    build: ./backend
    container_name: mealfit-backend
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # RDS 주소 전체. TLS 인증서 검증(sslmode=verify-full)을 켠다. 형식은 .env.prod.example 참고
      DB_URL: ${DB_URL:?DB_URL(RDS 접속 주소)을 .env에 설정하세요}
      DB_USERNAME: ${DB_USERNAME:-mealfit}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD를 .env에 설정하세요}
      # 로그인 토큰 서명 키(Base64, 디코딩 후 32바이트 이상). 없으면 서버가 뜨지 않는다
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET를 .env에 설정하세요 (openssl rand -base64 48)}
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://ai-service:8000}
      # 이메일 인증 및 쿠키·출처 보안 설정 (실제 SMTP 비밀번호는 서버 .env에만 둔다)
      MAIL_PROVIDER: ${MAIL_PROVIDER:-log}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-MealFit}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost}
      AUTH_ALLOWED_ORIGINS: ${AUTH_ALLOWED_ORIGINS:-http://localhost}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      # [소셜로그인] Google·Naver·Kakao OAuth2 키 (실제 값은 서버 .env에만 둔다)
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-disabled}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-disabled}
      NAVER_CLIENT_ID: ${NAVER_CLIENT_ID:-disabled}
      NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET:-disabled}
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID:-disabled}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:-disabled}
      TZ: Asia/Seoul
    # RDS 인증서 번들(global-bundle.pem)이 있는 서버 폴더를 읽기 전용으로 붙인다
    # 서버에서 한 번: sudo mkdir -p /etc/mealfit && sudo curl -o /etc/mealfit/rds-global-bundle.pem https://truststore.pki.rds.amazonaws.com/global/global-bundle.pem
    volumes:
      - ${RDS_CA_DIR:-/etc/mealfit}:/etc/mealfit:ro
    expose:
      - "8080"

  frontend:
    build: ./frontend
    container_name: mealfit-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    environment:
      # 도메인과 인증서가 모두 있을 때만 HTTPS를 켠다. 비우면 HTTP로만 서비스 (docs/https-setup.md)
      HTTPS_DOMAIN: ${HTTPS_DOMAIN:-}
    volumes:
      - ${LETSENCRYPT_DIR:-/etc/letsencrypt}:/etc/letsencrypt:ro
      - ${ACME_WEBROOT:-/var/www/certbot}:/var/www/certbot:ro

  # Flask + Gemini. backend가 AI_SERVICE_URL(http://ai-service:8000)로만 부르고 외부에는 열지 않는다.
  # GEMINI_API_KEY가 없어도 배포는 멈추지 않는다 → AI가 503을 주고 backend는 검증된 로컬 대체 식단을 쓴다
  ai-service:
    build: ./ai-service
    container_name: mealfit-ai
    restart: always
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      HOST: 0.0.0.0
      PORT: 8000
      # 자세 판별 모델. 버전 폴더가 없으면 판정 요청에만 503(POSE_003)을 주고 나머지 기능은 그대로 동작한다
      POSE_MODEL_VERSION: ${POSE_MODEL_VERSION:-pose-20261123-41}
      POSE_MODEL_DIR: /models/pose/${POSE_MODEL_VERSION:-pose-20261123-41}
      TZ: Asia/Seoul
    # 자세 판별 모델 폴더(버전별). git과 이미지에 넣지 않고 서버에서 읽기 전용으로 붙인다 (docs/pose-deploy.md)
    volumes:
      - ${POSE_MODELS_ROOT:-/opt/mealfit/models/pose}:/models/pose:ro
    expose:
      - "8000"
