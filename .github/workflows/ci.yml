name: CI

# 브랜치 흐름: 작업 브랜치 ──PR──▶ develop(벽) ──PR──▶ main
# - develop 으로 가는 PR: backend · frontend · ai-service 기본 검사
# - main 으로 가는 PR: 기본 검사 + 출처 확인(develop·hotfix/* 만) + 통합 검사(전체 컨테이너 기동)
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# PR에 새로 push하면 이전 실행은 취소한다. main push는 배포 도중 끊기지 않게 순서대로 실행
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend:
    name: backend (test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      # Windows에서 커밋하면 실행 권한이 빠질 수 있다
      - name: Make gradlew executable
        run: chmod +x gradlew
      - name: Test
        run: ./gradlew test --no-daemon
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: backend/build/reports/tests/test
          retention-days: 7

  frontend:
    name: frontend (lint, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  ai-service:
    name: ai-service (test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ai-service/requirements.txt
      - run: pip install -r requirements.txt
      # 테스트는 Gemini 호출을 가짜로 바꿔서 돈다 (API 키 불필요)
      - run: python -m unittest -v

  # main 은 develop(또는 급한 수정 hotfix/*)에서 온 PR만 받는다
  source-branch:
    name: source branch (develop → main)
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Check PR source
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          case "$HEAD_REF" in
            develop|hotfix/*) echo "출처 확인: $HEAD_REF → main" ;;
            *) echo "::error::main 으로는 develop 또는 hotfix/* 브랜치에서만 PR을 올립니다 (현재: $HEAD_REF). PR 대상 브랜치를 develop 으로 바꾸세요"; exit 1 ;;
          esac

  # develop → main 단계에서만 도는 무거운 검사: 운영과 같은 구성으로 전체 컨테이너를 띄워 응답을 확인한다
  # 비밀값은 이 실행에서만 쓰는 임시 값이다 (Gemini 키 없음 → AI는 로컬 대체 식단으로 동작)
  integration:
    name: integration (docker compose)
    needs: [backend, frontend, ai-service]
    if: (github.event_name == 'pull_request' && github.base_ref == 'main') || (github.event_name != 'pull_request' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Create temporary .env
        run: |
          {
            echo "DB_PASSWORD=$(openssl rand -hex 16)"
            echo "DB_ROOT_PASSWORD=$(openssl rand -hex 16)"
            echo "JWT_SECRET=$(openssl rand -base64 48 | tr -d '\n')"
          } > .env
      - name: Build and start all services
        run: docker compose -f docker-compose.prod.yml up -d --build
      # nginx(화면) 200, Spring(API)은 로그인 필요 4xx 가 오면 정상 (죽어 있으면 nginx가 502)
      - name: Smoke test
        run: |
          for i in $(seq 1 60); do
            web=$(curl -s -o /dev/null -w '%{http_code}' http://localhost/ || true)
            api=$(curl -s -o /dev/null -w '%{http_code}' http://localhost/api/v1/health-check || true)
            if [ "$web" = "200" ] && [ "${api:0:1}" = "4" ]; then
              echo "통합 검사 통과 (web=$web, api=$api)"
              exit 0
            fi
            sleep 5
          done
          echo "::error::컨테이너가 응답하지 않습니다 (web=$web, api=$api)"
          exit 1
      - name: Container logs
        if: failure()
        run: docker compose -f docker-compose.prod.yml logs --no-color --tail 200
      - name: Stop services
        if: always()
        run: docker compose -f docker-compose.prod.yml down -v

  # [배포 중단 2026-11-13] 저장소 변수 DEPLOY_ENABLED 가 'true' 일 때만 실행한다 (기본: 건너뜀).
  # 다시 배포하려면 Settings → Secrets and variables → Actions → Variables 에 DEPLOY_ENABLED=true 를 추가하고
  # 아래 EC2_HOST 가 서버의 현재 IP인지 확인한다.
  # 켜져 있으면 main 에 push되거나 Actions 화면에서 main으로 Run workflow를 누를 때,
  # 모든 검사(통합 검사 포함)가 통과한 뒤 EC2에 배포한다
  # 필요한 Secret: EC2_SSH_KEY(.pem 파일 내용)
  # 서버 IP는 웹사이트 주소로 공개되는 값이라 여기 둔다. 탄력적 IP가 바뀌면 이 값만 고친다
  deploy:
    name: deploy (EC2)
    needs: [backend, frontend, ai-service, integration]
    if: vars.DEPLOY_ENABLED == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EC2_HOST: 3.39.100.188
    steps:
      - name: Set up SSH key
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          if [ -z "$EC2_SSH_KEY" ]; then
            echo "::error::Secret EC2_SSH_KEY가 비어 있습니다 (Settings → Secrets and variables → Actions)"
            exit 1
          fi
          echo "배포 대상: $EC2_HOST"
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2.pem
          chmod 600 ~/.ssh/ec2.pem
          if ! ssh-keyscan -T 15 -H "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null || [ ! -s ~/.ssh/known_hosts ]; then
            echo "::error::$EC2_HOST:22 에 접속할 수 없습니다. EC2 보안 그룹의 SSH(22) 소스가 0.0.0.0/0 인지 확인하세요"
            exit 1
          fi

      # 서버의 .env는 git이 무시하는 파일이라 reset 해도 그대로 남는다
      - name: Pull and restart containers
        run: |
          ssh -i ~/.ssh/ec2.pem ubuntu@"$EC2_HOST" '
            set -e
            cd ~/MealFit
            git fetch -q origin main
            git reset -q --hard origin/main
            git log --oneline -1
            docker compose -f docker-compose.prod.yml up -d --build
            docker image prune -f > /dev/null
          '

      # nginx(화면)와 Spring(API)이 모두 응답할 때까지 최대 3분 기다린다
      # 없는 API 경로를 부르면 Spring이 살아 있을 때는 4xx(로그인 필요 401 등)가 오고,
      # Spring이 죽어 있거나 시작 중이면 nginx가 502를 준다
      - name: Health check
        run: |
          for i in $(seq 1 36); do
            web=$(curl -s -o /dev/null -w '%{http_code}' "http://$EC2_HOST/" || true)
            api=$(curl -s -o /dev/null -w '%{http_code}' "http://$EC2_HOST/api/v1/health-check" || true)
            if [ "$web" = "200" ] && [ "${api:0:1}" = "4" ]; then
              echo "배포 완료: http://$EC2_HOST (web=$web, api=$api)"
              exit 0
            fi
            sleep 5
          done
          echo "::error::서버가 응답하지 않습니다 (web=$web, api=$api). 서버에서 docker logs mealfit-backend 로 원인을 확인하세요"
          exit 1
