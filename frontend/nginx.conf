# 개발 서버의 Vite 프록시와 같은 구조: 브라우저는 /api만 부르고 nginx가 Spring으로 넘긴다 (CORS 불필요)
# 접근 로그에 주소의 쿼리와 Referer를 남기지 않는다 (이메일 인증 token, 소셜 로그인 code·state 보호)
map $request_uri $logged_path {
    default $uri;
    "~^(?<path_only>[^?]*)" $path_only;
}
log_format mealfit '$remote_addr [$time_local] "$request_method $logged_path $server_protocol" '
                   '$status $body_bytes_sent $request_time $request_id "$http_user_agent"';

# 80 포트: 기본은 화면·API, HTTPS가 켜지면 https로 이동 (30-mealfit-https.sh가 시작할 때 정한다)
server {
    listen 80;
    server_name _;

    access_log /var/log/nginx/access.log mealfit;
    include /etc/nginx/mealfit/port80.conf;
}

# 인증서가 있을 때만 생기는 파일이라 없어도 된다
include /etc/nginx/mealfit/https*.conf;
