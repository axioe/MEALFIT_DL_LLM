# 개발 서버의 Vite 프록시와 같은 구조: 브라우저는 /api만 부르고 nginx가 Spring으로 넘긴다 (CORS 불필요)
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # backend 컨테이너가 재시작돼 IP가 바뀌어도 다시 찾도록 Docker 내부 DNS를 쓴다
    resolver 127.0.0.11 valid=10s;

    location /api/ {
        set $backend http://backend:8080;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # AI 추천은 최대 20초 + 여유
        proxy_read_timeout 60s;
    }

    # 식재료 사진 인식: 사진 10MB + multipart 여유 (Spring max-request-size와 동일). 그 밖의 /api/는 nginx 기본값 1MB
    location = /api/v1/inventory/recognitions/photo {
        client_max_body_size 11m;
        set $backend http://backend:8080;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 운동 자세 판별: 관절 좌표 JSON (최대 60초·15fps, AI-05)
    location = /api/v1/workout/pose-analyses {
        client_max_body_size 3m;
        set $backend http://backend:8080;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # [소셜로그인] OAuth2 진입(/oauth2/) 및 콜백(/login/oauth2/)을 백엔드로 전달합니다.
    location /oauth2/ {
        set $backend http://backend:8080;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /login/oauth2/ {
        set $backend http://backend:8080;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 빌드 파일명에 해시가 붙으므로 오래 캐시해도 된다
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # React Router: /fridge 같은 주소에서 새로고침해도 index.html을 준다
    location / {
        try_files $uri $uri/ /index.html;
    }
}
